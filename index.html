<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuantVoyager 数据采集链路</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1117; color: #e6edf3; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; }
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 240px; min-width: 240px; background: #161b22; border-right: 1px solid #30363d; padding: 12px; overflow-y: auto; position: fixed; top: 0; bottom: 0; }
.sidebar h2 { font-size: 14px; color: #58a6ff; margin-bottom: 8px; }
.search-box { width: 100%; padding: 6px 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 12px; margin-bottom: 12px; }
.search-box:focus { outline: none; border-color: #58a6ff; }
.group-label { color: #6c757d; font-size: 11px; text-transform: uppercase; margin: 12px 0 4px; letter-spacing: 0.5px; }
.task-item { padding: 6px 10px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; font-size: 13px; color: #adb5bd; transition: background 0.15s; }
.task-item:hover { background: #21262d; }
.task-item.active { background: #1f6feb; color: #fff; }
.task-item.disabled { opacity: 0.45; }
.main { flex: 1; margin-left: 240px; padding: 24px 32px; max-width: calc(100% - 240px); }
.main h1 { font-size: 20px; margin-bottom: 4px; }
.meta-line { color: #6c757d; font-size: 12px; margin-bottom: 20px; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-right: 6px; }
.tag-static { background: #1f6feb33; color: #58a6ff; }
.tag-market { background: #23863633; color: #3fb950; }
.tag-skip { background: #6e768133; color: #d2a8ff; }
.tag-em { background: #d9770633; color: #f59e0b; }
.tag-sina { background: #dc262633; color: #f85149; }
.tag-jsl { background: #2563eb33; color: #58a6ff; }
.tag-ths { background: #7c3aed33; color: #bc8cff; }
.tag-tx { background: #16a34a33; color: #3fb950; }
.tag-exch { background: #0891b233; color: #39c5cf; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
.card-header { background: #21262d; padding: 10px 16px; border-bottom: 1px solid #30363d; font-weight: 600; color: #58a6ff; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.card-header .ts { color: #6c757d; font-size: 11px; font-weight: 400; }
.card-body { padding: 16px; }
.card-body pre { background: #0d1117; padding: 12px; border-radius: 6px; color: #e6edf3; font-size: 12px; overflow-x: auto; font-family: "SF Mono", "Fira Code", monospace; line-height: 1.5; }
.url-box { background: #0d1117; padding: 8px 12px; border-radius: 6px; color: #7ee787; font-size: 12px; word-break: break-all; margin-bottom: 8px; font-family: monospace; }
.field-label { color: #6c757d; font-size: 11px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
code { color: #ffa657; font-family: "SF Mono", "Fira Code", monospace; font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #21262d; color: #58a6ff; text-align: left; padding: 8px 10px; border-bottom: 1px solid #30363d; font-weight: 600; }
td { padding: 6px 10px; border-bottom: 1px solid #21262d; }
tr:hover td { background: #161b22; }
.col-name { color: #ffa657; font-family: monospace; }
.col-type { color: #6c757d; }
.col-sample { color: #7ee787; font-family: monospace; }
.flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.flow-node { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; }
.flow-arrow { color: #6c757d; font-size: 16px; }
.tabs { display: flex; gap: 4px; margin-bottom: 0; }
.tab { padding: 6px 16px; background: #21262d; border: 1px solid #30363d; border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 12px; color: #adb5bd; }
.tab.active { background: #161b22; color: #58a6ff; border-bottom: 1px solid #161b22; }
.expand-btn { color: #58a6ff; cursor: pointer; font-size: 12px; padding: 4px; }
.expand-btn:hover { text-decoration: underline; }
.no-data { color: #6c757d; font-style: italic; padding: 8px 0; }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <h2>📊 数据采集链路</h2>
    <input class="search-box" type="text" placeholder="🔍 搜索任务/数据源/表..." onkeyup="filterTasks()">
    <div id="task-list">
      
      <div class="group-label">⏰ static (盘后)</div>
      
      <div class="task-item "
           data-task="scrape_stock_info"
           data-search="股票基础信息 stock_info_sh_name_code stock_info_sz_name_code stock_info_bj_name_code sec_basic_info 交易所"
           onclick="selectTask('scrape_stock_info')">
        股票基础信息
      </div>
      
      <div class="task-item "
           data-task="scrape_convertible_bond_basic_info"
           data-search="可转债基础信息 convertible_bond_basic_info sec_basic_info convertible_bond_basic_info 东财"
           onclick="selectTask('scrape_convertible_bond_basic_info')">
        可转债基础信息
      </div>
      
      <div class="task-item "
           data-task="scrape_convertible_bond_basic_items"
           data-search="可转债详情（价值指标） convertible_bond_basic_items convertible_bond_basic_info convertible_bond_market_quotation 东财"
           onclick="selectTask('scrape_convertible_bond_basic_items')">
        可转债详情（价值指标）
      </div>
      
      <div class="task-item "
           data-task="scrape_convertible_bond_mandatory_redemption_clause"
           data-search="强赎条款 bond_cb_redeem_jsl convertible_bond_mandatory_redemption_clause 集思录"
           onclick="selectTask('scrape_convertible_bond_mandatory_redemption_clause')">
        强赎条款
      </div>
      
      <div class="task-item "
           data-task="scrape_convertible_bond_convertion_clause"
           data-search="转股条款 + 转股价调整 convertible_bond_convertion_clause convertible_bond_convertion_price_adjustment convertible_bond_convertion_clause convertible_bond_convertion_price_adjustment 东财"
           onclick="selectTask('scrape_convertible_bond_convertion_clause')">
        转股条款 + 转股价调整
      </div>
      
      <div class="task-item "
           data-task="cleanup_delisted_convertible_bonds"
           data-search="退市可转债清理 none sec_basic_info sec_daily_kline convertible_bond_basic_info convertible_bond_issue_info convertible_bond_convertion_clause convertible_bond_convertion_price_adjustment convertible_bond_mandatory_redemption_clause convertible_bond_resale_clause convertible_bond_down_adjustment_clause convertible_bond_interest_rate_explanation convertible_bond_value_analysis convertible_bond_market_quotation none"
           onclick="selectTask('cleanup_delisted_convertible_bonds')">
        退市可转债清理
      </div>
      
      <div class="task-item "
           data-task="scrape_disclosure_yysj"
           data-search="预约披露时间（PEAD 01e） stock_yysj_em disclosure_yysj 东财"
           onclick="selectTask('scrape_disclosure_yysj')">
        预约披露时间（PEAD 01e）
      </div>
      
      <div class="task-item "
           data-task="scrape_trade_calendar"
           data-search="交易日历 tool_trade_date_hist_sina trade_calendar 新浪"
           onclick="selectTask('scrape_trade_calendar')">
        交易日历
      </div>
      
      <div class="task-item "
           data-task="scrape_performance_forecast"
           data-search="业绩预告（PEAD 01a） stock_performance_forecast_em performance_forecast 东财"
           onclick="selectTask('scrape_performance_forecast')">
        业绩预告（PEAD 01a）
      </div>
      
      <div class="task-item "
           data-task="scrape_analyst_forecast"
           data-search="分析师预测（PEAD 01a） stock_analyst_forecast_ths analyst_forecast 同花顺"
           onclick="selectTask('scrape_analyst_forecast')">
        分析师预测（PEAD 01a）
      </div>
      
      <div class="task-item "
           data-task="scrape_financial_quarterly"
           data-search="季度财报（PEAD 01a） stock_profit_quarterly_em financial_quarterly 东财"
           onclick="selectTask('scrape_financial_quarterly')">
        季度财报（PEAD 01a）
      </div>
      
      <div class="task-item disabled"
           data-task="scrape_special_treatment_stock_list"
           data-search="ST股票列表（已禁用） stock_zh_a_st_em special_treatment_stock 东财"
           onclick="selectTask('scrape_special_treatment_stock_list')">
        ST股票列表（已禁用）
      </div>
      
      <div class="task-item disabled"
           data-task="scrape_convertible_bond_issue_info"
           data-search="可转债发行信息（已禁用） bond_zh_cov_info convertible_bond_issue_info 东财"
           onclick="selectTask('scrape_convertible_bond_issue_info')">
        可转债发行信息（已禁用）
      </div>
      
      <div class="task-item disabled"
           data-task="scrape_convertible_bond_value_analysis"
           data-search="可转债价值分析（已禁用） bond_zh_cov_value_analysis convertible_bond_value_analysis 东财"
           onclick="selectTask('scrape_convertible_bond_value_analysis')">
        可转债价值分析（已禁用）
      </div>
      
      <div class="task-item disabled"
           data-task="scrape_convertible_bond_interest_rate_explanation"
           data-search="利率说明（已禁用） convertible_bond_interest_rate_explanation convertible_bond_interest_rate_explanation 东财"
           onclick="selectTask('scrape_convertible_bond_interest_rate_explanation')">
        利率说明（已禁用）
      </div>
      
      <div class="task-item disabled"
           data-task="scrape_convertible_bond_down_adjustment_clause"
           data-search="下修条款（已禁用） convertible_bond_down_adjustment_clause convertible_bond_down_adjustment_clause 东财"
           onclick="selectTask('scrape_convertible_bond_down_adjustment_clause')">
        下修条款（已禁用）
      </div>
      
      <div class="task-item disabled"
           data-task="scrape_convertible_bond_resale_clause"
           data-search="回售条款（已禁用） convertible_bond_resale_clause convertible_bond_resale_clause 东财"
           onclick="selectTask('scrape_convertible_bond_resale_clause')">
        回售条款（已禁用）
      </div>
      
      
      <div class="group-label">📈 market (盘中)</div>
      
      <div class="task-item "
           data-task="scrape_convertible_bond_market_quotation"
           data-search="可转债行情采集 bond_zh_hs_cov_spot convertible_bond_market_quotation 新浪"
           onclick="selectTask('scrape_convertible_bond_market_quotation')">
        可转债行情采集
      </div>
      
      <div class="task-item "
           data-task="scrape_convertible_bond_market_comparison"
           data-search="行情对比（东财） bond_cov_list convertible_bond_market_quotation 东财"
           onclick="selectTask('scrape_convertible_bond_market_comparison')">
        行情对比（东财）
      </div>
      
      <div class="task-item "
           data-task="scrape_stock_individual_info"
           data-search="个股核心指标 stock_individual_info_tx stock_core_indicator 腾讯"
           onclick="selectTask('scrape_stock_individual_info')">
        个股核心指标
      </div>
      
      <div class="task-item "
           data-task="scrape_convertible_bond_and_convert_stock_daily_kline"
           data-search="日K线（转债+正股） stock_zh_a_hist sec_daily_kline 腾讯"
           onclick="selectTask('scrape_convertible_bond_and_convert_stock_daily_kline')">
        日K线（转债+正股）
      </div>
      
      <div class="task-item "
           data-task="scrape_convertible_bond_jsl_index"
           data-search="集思录等权指数 bond_cb_index_jsl convertible_bond_jsl_index 集思录"
           onclick="selectTask('scrape_convertible_bond_jsl_index')">
        集思录等权指数
      </div>
      
      <div class="task-item "
           data-task="run_low_premium_small_cap_strategy"
           data-search="低溢价小盘策略选债 none（策略运行器）  none"
           onclick="selectTask('run_low_premium_small_cap_strategy')">
        低溢价小盘策略选债
      </div>
      
      
    </div>
  </div>
  <div class="main" id="main-content">
    <p class="no-data">点击左侧任务查看详情...</p>
  </div>
</div>

<script>
const PIPELINES = [{"task_id": "scrape_stock_info", "task_name": "股票基础信息", "scheduler": "static", "cron": "周一至五 17:00", "skip_non_trading_day": true, "enabled": true, "collector": ["stock_info_sh_name_code", "stock_info_sz_name_code", "stock_info_bj_name_code"], "collector_source": "交易所", "mapper": "mapping_to_sh/sz/bj_sec_basic_info_list", "mapper_notes": "分别映射上交所(主板A股/B股/科创板)、深交所(A股/B股)、北交所，symbol = sec_code + '.SH/.SZ/.BJ'", "storage": "bulk_upsert", "target_tables": ["sec_basic_info"], "iteration": "batch"}, {"task_id": "scrape_convertible_bond_basic_info", "task_name": "可转债基础信息", "scheduler": "static", "cron": "周一至五 17:05", "skip_non_trading_day": true, "enabled": true, "collector": "convertible_bond_basic_info", "collector_source": "东财", "mapper": "mapping_to_convertible_bond_basic_info_em", "mapper_notes": "df.T 转置后映射；返回 (sec_basic_info_data, cb_basic_info_data) 两个 dict，分别写入两张表", "storage": "upsert", "target_tables": ["sec_basic_info", "convertible_bond_basic_info"], "iteration": "per_symbol"}, {"task_id": "scrape_convertible_bond_basic_items", "task_name": "可转债详情（价值指标）", "scheduler": "static", "cron": "周一至五 17:15", "skip_non_trading_day": true, "enabled": true, "collector": "convertible_bond_basic_items", "collector_source": "东财", "mapper": "mapping_to_convertible_bond_other_value_indicator", "mapper_notes": "返回 (cb_basic_info_data, cb_market_quotation_data)；剩余规模/付息日→basic_info，转股价/纯债价值/期权价值/ytm→market_quotation", "storage": "upsert", "target_tables": ["convertible_bond_basic_info", "convertible_bond_market_quotation"], "iteration": "per_symbol"}, {"task_id": "scrape_convertible_bond_mandatory_redemption_clause", "task_name": "强赎条款", "scheduler": "static", "cron": "周一至五 17:30", "skip_non_trading_day": true, "enabled": true, "collector": "bond_cb_redeem_jsl", "collector_source": "集思录", "mapper": "mapping_to_convertible_bond_mandatory_redemption_clause", "mapper_notes": "集思录强赎列表批量映射", "storage": "bulk_upsert", "target_tables": ["convertible_bond_mandatory_rede function selectTask(taskId) {
  document.querySelectorAll('.task-item').forEach(el => {
    el.classList.toggle('active', el.dataset.task === taskId);
  });
  const p = PIPELINES.find(x => x.task_id === taskId);
  if (!p) return;
  document.getElementById('main-content').innerHTML = renderTask(p);
}

function renderTask(p) {
  let html = '';
  html += `<h1>${p.task_name}</h1>`;
  html += `<div class="meta-line">`;
  html += `<span class="tag tag-${p.scheduler}">${p.scheduler}</span>`;
  html += `cron: ${p.cron}`;
  if (p.skip_non_trading_day) html += ` <span class="tag tag-skip">skip_non_trading_day</span>`;
  if (!p.enabled) html += ` <span class="tag" style="background:#6e768133;color:#f85149">已禁用</span>`;
  html += `</div>`;

  const collectors = Array.isArray(p.collector) ? p.collector : [p.collector];
  const sourceTag = {'东财':'em','新浪':'sina','集思录':'jsl','同花顺':'ths','腾讯':'tx','交易所':'exch','none':''};
  html += `<div class="card"><div class="card-header">📡 数据源函数</div><div class="card-body">`;
  collectors.forEach(c => {
    html += `<code>${c}()</code>`;
    if (CAPTURE_SAMPLES[c]) html += ` <span class="tag tag-${sourceTag[p.collector_source]||''}">${p.collector_source}</span>`;
    html += `<br>`;
  });
  if (!collectors.some(c => CAPTURE_SAMPLES[c])) {
    html += `<span class="no-data">暂无请求样本，等待定时任务执行后生成</span>`;
  }
  html += `</div></div>`;

  collectors.forEach(c => {
    const sample = CAPTURE_SAMPLES[c];
    if (!sample) return;
    html += `<div class="card"><div class="card-header">🌐 真实请求 — ${c}() <span class="ts">采集于 ${sample.ts}</span></div><div class="card-body">`;
    html += `<div class="field-label">${sample.method} URL</div>`;
    html += `<div class="url-box">${sample.url}</div>`;
    if (sample.params) {
      html += `<div class="field-label">PARAMS</div>`;
      html += `<pre>${JSON.stringify(sample.params, null, 2)}</pre>`;
    }
    html += `</div></div>`;
    html += `<div class="card"><div class="card-header">📦 响应示例 <span class="ts">${sample.status_code} · 截断前2000字符 / 共${sample.response_full_length}字符</span></div><div class="card-body">`;
    html += `<pre>${escapeHtml(sample.response_truncated)}</pre>`;
    html += `</div></div>`;
  });

  html += `<div class="card"><div class="card-header">🔀 映射函数</div><div class="card-body">`;
  html += `<code>${p.mapper}</code>`;
  if (p.mapper_notes) html += `<div style="color:#6c757d;font-size:12px;margin-top:8px;line-height:1.6">${p.mapper_notes}</div>`;
  html += `</div></div>`;

  if (p.target_tables.length > 0) {
    const needTabs = p.target_tables.length > 1;
    if (needTabs) {
      html += `<div class="tabs">`;
      p.target_tables.forEach((t, i) => {
        html += `<div class="tab ${i===0?'active':''}" onclick="switchTab(this,'${t}')">${t}</div>`;
      });
      html += `</div>`;
    }
    p.target_tables.forEach((t, i) => {
      const info = TABLE_INFOS[t];
      const display = needTabs ? (i===0?'block':'none') : 'block';
      html += `<div class="card tab-content" data-table="${t}" style="display:${display}">`;
      html += `<div class="card-header">💾 目标表 — ${t}`;
      if (info && !info.error) {
        html += `<span class="ts">${info.row_count} 行 · 最新: ${info.latest_update || 'N/A'}</span>`;
      }
      html += `</div><div class="card-body">`;
      if (!info) {
        html += `<span class="no-data">未找到表定义</span>`;
      } else if (info.error) {
        html += `<span class="no-data">数据库连接失败: ${escapeHtml(info.error)}</span>`;
      } else {
        const cols = info.columns;
        const showCount = Math.min(8, cols.length);
        html += `<table><thead><tr><th>字段</th><th>类型</th><th>说明</th><th>实际数据样例</th></tr></thead><tbody>`;
        cols.forEach((col, ci) => {
          const sampleVal = info.sample_rows[0] ? (info.sample_rows[0][col.name] ?? '') : '';
          const hidden = ci >= showCount ? 'style="display:none"' : '';
          html += `<tr class="field-row" ${hidden}><td class="col-name">${col.name}</td><td class="col-type">${col.type}</td><td>${col.comment}</td><td class="col-sample">${escapeHtml(String(sampleVal))}</td></tr>`;
        });
        html += `</tbody></table>`;
        if (cols.length > 8) {
          html += `<div class="expand-btn" onclick="toggleFields(this)">展开全部 ${cols.length} 个字段 ▾</div>`;
        }
      }
      html += `</div></div>`;
    });
  }

  html += `<div class="card"><div class="card-header">🔗 全链路</div><div class="card-body">`;
  html += `<div class="flow">`;
  html += `<span class="flow-node" style="background:#264f78;color:#fff">${p.collector_source} API</span>`;
  html += `<span class="flow-arrow">→</span>`;
  const c0 = Array.isArray(p.collector) ? p.collector[0] : p.collector;
  html += `<span class="flow-node" style="background:#1f6f3f;color:#fff">${c0}()</span>`;
  html += `<span class="flow-arrow">→</span>`;
  html += `<span class="flow-node" style="background:#5d3f9f;color:#fff">${p.mapper}</span>`;
  html += `<span class="flow-arrow">→</span>`;
  html += `<span class="flow-node" style="background:#8b6914;color:#fff">${p.storage}</span>`;
  html += `<span class="flow-arrow">→</span>`;
  html += `<span class="flow-node" style="background:#9b2226;color:#fff">${p.target_tables.join(', ') || 'N/A'}</span>`;
  html += `</div></div></div>`;

  return html;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function filterTasks() {
  const q = document.querySelector('.search-box').value.toLowerCase();
  document.querySelectorAll('.task-item').forEach(el => {
    const text = el.dataset.search.toLowerCase();
    el.style.display = text.includes(q) ? '' : 'none';
  });
}

function toggleFields(btn) {
  const rows = btn.previousElementSibling.querySelectorAll('.field-row');
  const hidden = [...rows].some(r => r.style.display === 'none');
  rows.forEach(r => r.style.display = '');
  btn.textContent = hidden ? `收起 ▴` : `展开全部 ${rows.length} 个字段 ▾`;
  if (hidden) {
    rows.forEach((r, i) => { if (i >= 8) r.style.display = 'none'; });
  }
}

function switchTab(tabEl, tableName) {
  tabEl.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');
  const parent = tabEl.closest('.main');
  parent.querySelectorAll('.tab-content').forEach(c => {
    c.style.display = c.dataset.table === tableName ? 'block' : 'none';
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const first = PIPELINES.find(p => p.enabled);
  if (first) selectTask(first.task_id);
});
</script>
